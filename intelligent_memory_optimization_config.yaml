# 智能内存优化配置
# 确保测试用例不会消耗大量内存，同时保留所有测试功能

# 内存级别配置
memory_levels:
  emergency:
    description: "紧急模式 - 极度内存受限环境"
    memory_limit_mb: 8
    quickcheck_tests: 1
    quickcheck_max_size: 1
    quickcheck_max_shrinks: 0
    max_string_length: 10
    max_list_length: 3
    test_batch_size: 1
    gc_frequency: 1
    
  minimal:
    description: "最小模式 - 内存有限环境"
    memory_limit_mb: 16
    quickcheck_tests: 5
    quickcheck_max_size: 2
    quickcheck_max_shrinks: 0
    max_string_length: 20
    max_list_length: 5
    test_batch_size: 2
    gc_frequency: 2
    
  balanced:
    description: "平衡模式 - 正常内存环境"
    memory_limit_mb: 64
    quickcheck_tests: 10
    quickcheck_max_size: 5
    quickcheck_max_shrinks: 1
    max_string_length: 50
    max_list_length: 10
    test_batch_size: 5
    gc_frequency: 5

# 测试套件选择策略
test_selection:
  strategy: "intelligent_memory_based"
  preserve_all_tests: true
  
  # 基于内存级别的测试套件选择
  suites_by_level:
    emergency:
      - "Test.Unit.BasicQuickCheckTestSuite.tests"
      - "Test.Unit.ExtremeMemoryOptimizedTestSuite.tests"
      - "Test.Unit.CoreQuickCheckSpec.tests"
    
    minimal:
      - "Test.Unit.BasicQuickCheckTestSuite.tests"
      - "Test.Unit.MemoryOptimizedTestSuite.tests"
      - "Test.Unit.ExtremeMemoryOptimizedTestSuite.tests"
      - "Test.Unit.CoreQuickCheckSpec.tests"
      - "Test.Unit.ConciseTestSuite.tests"
    
    balanced:
      - "Test.Unit.BasicQuickCheckTestSuite.tests"
      - "Test.Unit.MemoryOptimizedTestSuite.tests"
      - "Test.Unit.EnhancedMemoryOptimizedTestSuite.tests"
      - "Test.Unit.ExtremeMemoryOptimizedTestSuite.tests"
      - "Test.Unit.AdvancedMemoryOptimizedTestSuite.tests"
      - "Test.Unit.ComprehensiveMemoryOptimizedTestSuite.tests"
      - "Test.Unit.CoreQuickCheckSpec.tests"

# 内存监控和自动调整
memory_monitoring:
  enable: true
  check_interval_ms: 100
  
  # 内存使用阈值
  thresholds:
    emergency_threshold: 0.9  # 90%内存使用时触发紧急模式
    critical_threshold: 0.8   # 80%内存使用时触发关键模式
    warning_threshold: 0.7    # 70%内存使用时发出警告
    
  # 自动调整策略
  auto_adjustment:
    enable: true
    strategies:
      - "reduce_test_batch_size"
      - "decrease_quickcheck_parameters"
      - "force_gc_between_tests"
      - "select_minimal_test_suites"

# 构建优化
build_optimization:
  ghc_options:
    - "-O0"  # 禁用优化以减少编译内存
    - "-j1"  # 单线程编译
    - "-rtsopts"
    - "-fno-warn-unused-imports"
    - "-fno-warn-unused-matches"
    - "-fno-warn-unused-binds"
    
  cabal_options:
    - "--disable-profiling"
    - "--disable-library-profiling"
    - "--disable-executable-profiling"
    
  environment:
    GHC_HEAP_SIZE: "32M"
    GHC_STACK_SIZE: "1M"
    CABAL_MAX_BUILD_JOBS: "1"

# 测试执行优化
test_execution:
  # 并行执行控制
  parallel_execution: false
  max_concurrent_tests: 1
  
  # 内存清理策略
  cleanup_strategy:
    force_gc_between_tests: true
    compact_heap_between_tests: true
    cleanup_temporary_files: true
    
  # 超时设置
  timeouts:
    default_timeout_seconds: 30
    emergency_timeout_seconds: 15
    critical_timeout_seconds: 20
    
  # 错误处理
  error_handling:
    out_of_memory_strategy: "reduce_and_continue"
    test_failure_strategy: "continue_with_next"
    retry_on_failure: false
    detailed_error_reporting: false

# 数据生成优化
data_generation:
  # 字符串生成限制
  string_limits:
    max_length: 50
    min_length: 0
    use_efficient_generators: true
    
  # 列表生成限制
  list_limits:
    max_length: 10
    min_length: 0
    use_efficient_generators: true
    
  # 整数生成限制
  integer_limits:
    max_value: 100
    min_value: -100
    
  # 自定义生成器
  custom_generators:
    use_minimal_strings: true
    use_limited_lists: true
    avoid_large_data_structures: true

# 测试保留策略
test_preservation:
  # 确保不删除任何测试
  preserve_all_tests: true
  
  # 优化版本优先
  prefer_optimized_versions: true
  
  # 回退策略
  fallback_strategy:
    enabled: true
    fallback_to_original: true
    fallback_to_simpler: true
    
  # 测试完整性验证
  integrity_check:
    verify_all_tests_exist: true
    verify_test_functionality: true
    log_missing_tests: true

# 日志和监控
logging:
  level: "INFO"  # DEBUG | INFO | WARN | ERROR
  
  # 日志内容
  log_memory_usage: true
  log_test_selection: true
  log_optimization_decisions: true
  log_performance_metrics: true
  
  # 输出格式
  output_format: "structured"  # structured | simple | json
  
  # 文件输出
  file_logging:
    enabled: true
    file_path: "./memory_optimization_test.log"
    max_size_mb: 10
    max_files: 5