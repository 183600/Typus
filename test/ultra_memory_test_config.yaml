# 超级内存优化测试配置
# 自动选择优化版本测试文件，确保最小内存使用

test_selection:
  strategy: "ultra_memory_optimized"
  priority: "optimized_over_original"
  
  # 优化版本测试文件优先级映射
  optimized_mappings:
    # 200测试文件的优化版本
    "Exact200QuickCheckTests": "Exact200QuickCheckTestsOptimized"
    "Final200QuickCheckTests": "Final200QuickCheckTestsOptimized"
    "Exactly200QuickCheckTests": "Exactly200QuickCheckTestsOptimized"
    "FinalExact200QuickCheckTests": "FinalExact200QuickCheckTestsOptimized"
    "True200QuickCheckTests": "True200QuickCheckTestsOptimized"
    
    # Comprehensive测试的优化版本
    "ComprehensiveQuickCheckTestSuite": "ComprehensiveMemoryOptimizedTestSuite"
    "ComprehensiveQuickCheckSpec": "EnhancedMemoryOptimizedTestSuite"
    "ComprehensiveTestSuite": "MemoryOptimizedTestSuite"
    
    # Advanced测试的优化版本
    "AdvancedQuickCheckTestSpec": "BasicQuickCheckTestSuite"
    "AdvancedMemoryOptimizedTestSuite": "ExtremeMemoryOptimizedTestSuite"
    
  # 自动替换规则
  auto_replace_rules:
    - pattern: "*200*.hs"
      replacement: "*200*Optimized.hs"
      priority: "high"
    - pattern: "*Comprehensive*.hs"
      replacement: "*MemoryOptimized*.hs"
      priority: "medium"
    - pattern: "*Advanced*.hs"
      replacement: "*Basic*.hs"
      priority: "low"
    - pattern: "*Enhanced*.hs"
      replacement: "*MemoryOptimized*.hs"
      priority: "medium"

# 内存使用策略
memory_strategy:
  # 检测可用内存并自动选择合适的配置
  auto_detect_memory: true
  memory_thresholds:
    emergency_mb: 2
    critical_mb: 4
    minimal_mb: 8
    low_mb: 16
    
  # 基于可用内存的测试选择
  memory_based_selection:
    "1-2": ["BasicQuickCheckTestSuite", "ExtremeMemoryOptimizedTestSuite"]
    "3-4": ["BasicQuickCheckTestSuite", "CoreQuickCheckSpec", "MemoryOptimizedTestSuite"]
    "5-8": ["BasicQuickCheckTestSuite", "CoreQuickCheckSpec", "MemoryOptimizedTestSuite", "EnhancedMemoryOptimizedTestSuite"]
    "9-16": ["BasicQuickCheckTestSuite", "CoreQuickCheckSpec", "MemoryOptimizedTestSuite", "EnhancedMemoryOptimizedTestSuite", "ComprehensiveMemoryOptimizedTestSuite"]

# 测试执行优化
execution_optimization:
  # 禁用并行测试以节省内存
  parallel_execution: false
  max_concurrent_tests: 1
  
  # 测试间隔清理
  cleanup_between_tests: true
  force_gc_between_tests: true
  compact_heap_between_tests: true
  
  # 超时设置
  default_timeout: 30
  emergency_timeout: 15
  critical_timeout: 20
  
  # 测试数据限制
  max_string_length: 10
  max_list_length: 5
  max_int_value: 100
  max_recursion_depth: 3

# QuickCheck优化
quickcheck_optimization:
  # 默认最小配置
  default_max_tests: 1
  default_max_size: 1
  default_max_shrinks: 0
  
  # 基于内存级别的动态调整
  dynamic_sizing:
    emergency: { tests: 1, size: 1, shrinks: 0 }
    critical: { tests: 1, size: 1, shrinks: 0 }
    minimal: { tests: 1, size: 2, shrinks: 0 }
    low: { tests: 2, size: 2, shrinks: 1 }
    
  # 数据生成优化
  data_generation:
    use_minimal_generators: true
    limit_string_generators: true
    limit_list_generators: true
    limit_tree_depth: true
    use_efficient_data_structures: true

# 构建优化
build_optimization:
  # 编译器选项
  ghc_options:
    - "-O0"  # 禁用优化以减少编译内存
    - "-j1"  # 单线程编译
    - "-rtsopts"
    - "-fno-warn-unused-imports"
    - "-fno-warn-unused-binds"
    
  # Cabal选项
  cabal_options:
    - "--flags=fast"
    - "--flags=minimal"
    
  # 环境变量
  environment:
    GHC_HEAP_SIZE: "64MB"
    GHC_STACK_SIZE: "1MB"
    CABAL_MAX_BUILD_JOBS: "1"

# 内存监控
memory_monitoring:
  enable: true
  check_interval: 100  # 每100ms检查一次
  emergency_threshold: 0.9  # 90%内存使用时触发紧急模式
  critical_threshold: 0.8   # 80%内存使用时触发关键模式
  
  # 自动内存管理
  auto_management:
    enable: true
    force_gc_on_threshold: true
    kill_on_memory_overflow: false  # 不杀死测试，而是暂停
    pause_on_memory_pressure: true
    resume_on_memory_available: true

# 测试保留策略
test_preservation:
  # 确保不删除任何测试文件
  preserve_all_tests: true
  
  # 但优先使用优化版本
  prefer_optimized: true
  
  # 回退策略：如果优化版本失败，尝试原始版本
  fallback_to_original: true
  
  # 记录策略
  log_test_selection: true
  log_memory_usage: true
  log_optimization_decisions: true

# 错误处理
error_handling:
  # 内存不足时的处理策略
  out_of_memory_strategy: "reduce_and_continue"
  
  # 测试失败时的处理
  test_failure_strategy: "continue_with_next"
  
  # 重试策略
  retry_on_failure: false  # 不重试以节省内存
  
  # 错误报告
  detailed_error_reporting: false  # 减少错误报告以节省内存
  minimal_error_output: true