# 增强内存测试配置 - Linux优化版
memory:
  limit_mb: 256
  batch_size: 10
  gc_frequency: 5
  test_selection_ratio: 0.5
  conservative_mode: false
  aggressive_gc: false

execution:
  strategy: batched
  max_concurrent_tests: 2
  timeout_seconds: 600

monitoring:
  enable_memory_monitoring: true
  log_memory_usage: false
  memory_check_interval: 500

optimization:
  enable_test_reuse: true
  enable_memory_prediction: true
  adaptive_scaling: true
  
environment:
  type: linux
  detected_memory_mb: 15989
