# 极度优化内存测试配置 - 最小化内存使用
memory:
  limit_mb: 8  # 进一步减少到8MB，极度内存优化
  batch_size: 1  # 最小批处理大小
  gc_frequency: 2  # 更频繁的GC（每2个操作执行一次GC）
  test_selection_ratio: 0.01  # 从0.05减少到0.01，选择极少量测试
  conservative_mode: true  # 启用保守模式
  aggressive_gc: true  # 启用激进的垃圾回收
  emergency_mode: true  # 启用紧急模式
  ultra_optimization: true  # 启用超级优化
  extreme_mode: true  # 启用极端模式
  ultra_extreme_mode: true  # 启用超极端模式

execution:
  strategy: batched
  max_concurrent_tests: 1
  timeout_seconds: 120  # 进一步减少到120秒

monitoring:
  enable_memory_monitoring: true
  log_memory_usage: false
  memory_check_interval: 250  # 从500减少到250，更频繁的检查

optimization:
  enable_test_reuse: true
  enable_memory_prediction: true
  adaptive_scaling: false  # 禁用自适应缩放以减少开销
  enable_test_filtering: true  # 启用测试过滤
  enable_data_size_limiting: true  # 启用数据大小限制
  
environment:
  type: ultra_memory_optimized
  detected_memory_mb: unknown
