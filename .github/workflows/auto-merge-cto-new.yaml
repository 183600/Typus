name: Auto-merge cto-new[bot] pull requests

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.event.pull_request.user.login == 'cto-new[bot]' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Ensure latest commit is approved
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const alreadyApproved = reviews.find((review) =>
              review.user?.login === 'github-actions[bot]' &&
              review.state === 'APPROVED' &&
              review.commit_id === headSha
            );

            if (alreadyApproved) {
              core.info(`Latest commit ${headSha} already has an approval from github-actions[bot].`);
            } else {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number,
                event: 'APPROVE',
                body: 'Automatically approving PR from cto-new[bot].',
              });
              core.info(`Submitted approval for PR #${pull_number}.`);
            }

      - name: Enable auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            if (pr.auto_merge) {
              core.info(`Auto-merge already configured for PR #${pr.number}.`);
              return;
            }

            const methods = ['SQUASH', 'MERGE', 'REBASE'];
            let enabled = false;

            for (const method of methods) {
              try {
                await github.graphql(
                  `mutation ($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {
                    enablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId, mergeMethod: $mergeMethod}) {
                      pullRequest {
                        number
                        autoMergeRequest {
                          enabledAt
                          mergeMethod
                        }
                      }
                    }
                  }`,
                  {
                    pullRequestId: pr.node_id,
                    mergeMethod: method,
                  }
                );
                core.info(`Enabled auto-merge for PR #${pr.number} using ${method.toLowerCase()} merge.`);
                enabled = true;
                break;
              } catch (error) {
                const errorInfo = error?.errors?.[0];
                const message = errorInfo?.message ?? error.message ?? String(error);
                const type = errorInfo?.type;

                if (type === 'AUTO_MERGE_ALREADY_ENABLED') {
                  core.info(`Auto-merge was already enabled for PR #${pr.number}.`);
                  enabled = true;
                  break;
                }

                if (type === 'MERGE_METHOD_NOT_ALLOWED' || message.includes('not allow')) {
                  core.info(`Merge method ${method.toLowerCase()} not allowed. Trying next option.`);
                  continue;
                }

                if (message.includes('Auto-merge is not enabled for this repository')) {
                  core.warning('Auto-merge is not enabled for this repository. Please enable it in repository settings.');
                  break;
                }

                throw error;
              }
            }

            if (!enabled) {
              core.warning(`Unable to enable auto-merge automatically for PR #${pr.number}.`);
            }
