name: iflow-cabal-autoloop

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: iflow-autoflow
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  run-5h:
    runs-on: ubuntu-latest
    env:
      RUN_HOURS: 5
      WORK_BRANCH: main
      IFLOW_API_KEY: ${{ secrets.IFLOW_API_KEY }}
    steps:
      - name: Checkout with PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.IFLOW_PAT }}
          fetch-depth: 0

      # ...你的安装/运行步骤...

      - name: Commit & push after ${RUN_HOURS}h
        if: always()
        run: |
          set -e
          git config user.name "iflow-bot"
          git config user.email "iflow-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ci: ${RUN_HOURS}h batch update (run $GITHUB_RUN_ID)"
            git push origin HEAD:main
          fi