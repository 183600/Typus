# 增强内存保持配置 - 确保测试用例不消耗大量内存但保持完整
# 这个配置应用严格的内存限制，同时保留所有测试用例

# 内存管理配置
memory_management:
  heap_limit_mb: 8  # 从12MB减少到8MB，进一步优化
  stack_limit_mb: 0.5  # 堆栈限制
  gc_strategy: aggressive  # 激进垃圾回收
  gc_frequency: 1  # 每次测试后强制GC
  memory_monitoring: true
  memory_check_interval: 300  # 更频繁的内存检查

# QuickCheck参数优化
quickcheck_optimization:
  # 测试规模限制
  max_success: 2  # 每个属性测试2次（从5减少）
  max_size: 1     # 测试数据规模限制为最小
  max_shrinks: 0  # 禁用收缩以节省内存
  
  # 输入数据限制
  string_max_length: 8    # 字符串最大长度8字符
  list_max_length: 3      # 列表最大长度3元素
  int_max_range: 10       # 整数范围限制在0-10
  
  # 高级优化
  enable_size_resizing: true
  force_small_inputs: true
  skip_large_generators: true

# 测试执行策略
test_execution:
  strategy: sequential  # 严格顺序执行
  batch_size: 1        # 单个测试批处理
  max_concurrent: 1    # 无并行执行
  timeout_seconds: 60  # 短超时时间
  
  # 测试间清理
  cleanup_between_tests: true
  force_gc_between_tests: true
  clear_caches_between_tests: true

# 测试选择策略（保持所有测试用例）
test_selection:
  # 启用所有测试类型
  enable_all_tests: true
  
  # 测试优先级（优化版本优先）
  priority_order:
    - "*Optimized.hs"      # 内存优化版本
    - "*MemoryOptimized*"  # 明确的内存优化文件
    - "*Basic*.hs"         # 基础测试
    - "*Core*.hs"          # 核心测试
    - "*Essential*.hs"     # 核心功能测试
    - "*.hs"              # 所有其他测试
  
  # 但不禁用任何测试类型
  disabled_tests: []  # 空列表表示不禁用任何测试

# 运行时优化
runtime_optimizations:
  # GHC RTS选项
  rts_options:
    - "-M8m"      # 堆内存限制8MB
    - "-K1m"      # 堆栈限制1MB
    - "-A256k"    # 分配区域256KB
    - "-c"        # 紧凑GC
    - "-I0"       # 禁用空闲GC
    - "-G1"       # 单代GC
    
  # 编译选项
  compile_options:
    - "-O0"       # 禁用优化以减少内存使用
    - "-fno-omit-yields"
    - "-fno-full-laziness"

# 环境配置
environment:
  # 强制内存优化环境
  force_memory_optimized: true
  enable_emergency_mode: true
  ultra_optimization: true
  
  # 系统限制
  ulimit_virtual_memory: 8192  # 8MB虚拟内存限制
  ulimit_stack: 512            # 512KB堆栈限制

# 监控和报告
monitoring:
  enable_real_time_monitoring: true
  log_memory_usage: false  # 禁用日志以减少开销
  track_test_progress: true
  report_memory_violations: true

# 安全限制
safety_limits:
  # 防止内存泄漏
  max_test_duration: 30  # 单个测试最长30秒
  max_memory_growth: 2   # 内存增长不超过2MB
  
  # 紧急终止条件
  emergency_termination:
    memory_exceeded: 10  # 超过10MB立即终止
    test_timeout: 60     # 测试超时60秒
    stack_overflow: true # 检测堆栈溢出

# 验证配置
validation:
  # 确保配置正确性
  verify_memory_limits: true
  check_test_coverage: true
  validate_optimizations: true
  
  # 成功标准
  success_criteria:
    memory_usage_below: 8   # 内存使用低于8MB
    all_tests_executed: true # 所有测试都执行
    no_test_removed: true   # 没有测试被删除