# 超级内存优化测试配置 - 极致内存节省
# 此配置确保测试用例不会消耗大量内存，同时尽量不删除测试用例

memory:
  limit_mb: 8  # 进一步减少到8MB
  batch_size: 1  # 最小批处理大小
  gc_frequency: 2  # 更频繁的GC
  test_selection_ratio: 0.02  # 选择极少的测试但保留所有测试文件
  conservative_mode: true
  aggressive_gc: true
  emergency_mode: true
  ultra_optimization: true
  extreme_mode: true
  adaptive_limits: true  # 新增：启用自适应限制
  memory_monitoring: true  # 新增：启用内存监控

optimization:
  # 数据大小限制策略
  max_string_length: 50
  max_list_size: 10
  max_test_cases: 3
  max_shrink_count: 0
  
  # 测试执行优化
  enable_test_reuse: true
  enable_memory_prediction: true
  adaptive_scaling: false
  smart_batching: true  # 新增：智能批处理
  
  # 内存清理策略
  pre_test_gc: true
  post_test_gc: true
  batch_gc: true
  emergency_gc: true

execution:
  strategy: sequential_batched  # 顺序批处理执行
  max_concurrent_tests: 1
  timeout_seconds: 180  # 减少超时时间
  retry_on_oom: true  # 新增：内存不足时重试
  
  # 批处理配置
  batch_memory_limit: 4  # 每批最大4MB
  max_tests_per_batch: 5
  adaptive_batching: true

monitoring:
  enable_memory_monitoring: true
  log_memory_usage: true
  memory_check_interval: 300  # 更频繁的内存检查
  alert_threshold_mb: 6  # 内存使用超过6MB时告警
  emergency_threshold_mb: 7  # 紧急阈值
  
  # 性能监控
  track_gc_time: true
  track_test_duration: true
  report_memory_stats: true

environment:
  type: ultra_memory_optimized
  priority: memory_efficiency
  preserve_all_tests: true  # 确保不删除测试用例
  
  # 内存保护策略
  memory_safety_net: true
  graceful_degradation: true
  fallback_strategies: true

validation:
  # 验证策略确保不丢失测试覆盖
  verify_test_coverage: true
  preserve_core_functionality: true
  maintain_test_integrity: true
  
  # 性能验证
  max_memory_usage_mb: 10
  max_execution_time_seconds: 300
  required_success_rate: 0.95